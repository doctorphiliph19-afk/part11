name: Periodic Hello

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'

jobs:
  health_check:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployed application health
        run: curl --fail --silent --show-error --retry 3 --retry-delay 5 --retry-connrefused https://part11-pokedex-doctorphiliph19.onrender.com/health
